<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .card-box { border: 1px solid #ddd !important; shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Navbar -->
    <header class="bg-indigo-700 text-white shadow-lg no-print">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center flex-wrap gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-graduation-cap text-3xl text-indigo-200"></i>
                <div>
                    <h1 class="text-xl font-bold">Student Grade Tracker</h1>
                    <p class="text-xs text-indigo-200">Manage & Sync Student Performance via JSONBin</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleModal('configModal')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 border border-indigo-400 transition">
                    <i class="fa-solid fa-gear"></i> JSONBin Settings
                </button>
                <button onclick="syncToJSONBin()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 shadow transition">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Sync JSONBin
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Form Section -->
        <section class="lg:col-span-4 no-print">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sticky top-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-3">
                    <i class="fa-solid fa-user-plus text-indigo-600"></i>
                    <span id="formTitle">Add Student Grade</span>
                </h2>
                
                <form id="gradeForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <input type="hidden" id="studentId">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Student Name</label>
                        <input type="text" id="studentName" required placeholder="e.g. John Doe" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Unit</label>
                            <input type="text" id="unit" required placeholder="e.g. Unit 1" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Lesson</label>
                            <input type="text" id="lesson" required placeholder="e.g. Lesson 3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Score</label>
                            <input type="number" id="score" min="0" step="0.5" required placeholder="45" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Max Grade</label>
                            <input type="number" id="maxScore" min="1" step="0.5" value="50" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Exam Date</label>
                        <input type="date" id="examDate" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg text-sm transition shadow">
                            Save Record
                        </button>
                        <button type="button" onclick="resetForm()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold px-3 py-2 rounded-lg text-sm transition">
                            Clear
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section class="lg:col-span-8 space-y-6">

            <!-- Stats -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 no-print">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <span class="text-xs text-slate-500 font-semibold block mb-1">Total Students</span>
                    <span id="statTotal" class="text-2xl font-bold text-slate-800">0</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <span class="text-xs text-slate-500 font-semibold block mb-1">Average %</span>
                    <span id="statAvg" class="text-2xl font-bold text-indigo-600">0%</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <span class="text-xs text-slate-500 font-semibold block mb-1">Highest %</span>
                    <span id="statHigh" class="text-2xl font-bold text-emerald-600">0%</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <span class="text-xs text-slate-500 font-semibold block mb-1">Pass Rate</span>
                    <span id="statPass" class="text-2xl font-bold text-blue-600">0%</span>
                </div>
            </div>

            <!-- Chart -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 no-print flex flex-col md:flex-row items-center gap-4">
                <div class="w-full md:w-1/2 h-48 flex justify-center">
                    <canvas id="gradeChart"></canvas>
                </div>
                <div class="w-full md:w-1/2 space-y-2 text-sm text-slate-600">
                    <h3 class="font-bold text-slate-800 border-b pb-1">Performance Overview</h3>
                    <p class="text-xs">Grade Breakdown across all Units and Lessons recorded.</p>
                </div>
            </div>

            <!-- Table Container -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b flex justify-between items-center flex-wrap gap-3 no-print">
                    <div class="flex items-center gap-2">
                        <input type="text" id="searchInput" oninput="renderData()" placeholder="Search student name..." class="px-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                            <i class="fa-solid fa-print"></i> Print / PDF
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse text-sm">
                        <thead class="bg-slate-50 text-slate-600 border-b">
                            <tr>
                                <th class="p-3">Student Name</th>
                                <th class="p-3">Unit</th>
                                <th class="p-3">Lesson</th>
                                <th class="p-3">Score</th>
                                <th class="p-3">%</th>
                                <th class="p-3">Grade</th>
                                <th class="p-3">Date</th>
                                <th class="p-3 no-print text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody" class="divide-y divide-slate-100 text-slate-700">
                            <!-- Rows rendered dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- JSONBin Settings Modal -->
    <div id="configModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800">JSONBin Credentials</h3>
                <button onclick="toggleModal('configModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">X-Master-Key</label>
                    <input type="password" id="modalApiKey" placeholder="$2a$10$..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Bin ID</label>
                    <input type="text" id="modalBinId" placeholder="66f..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="saveModalSettings()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg text-sm">Save & Load</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 📌 السطر 183: ضع بياناتك الخاصة هنا للربط المباشر
        // ==========================================
        let state = {
            apiKey: '$2a$10$JTukFZemeh85B37G.jPvyeJKY.UhiBFTNeS8TLgFgzRMlpYMlNeaK', // استبدل بـ X-Master-Key الخاص بك
            binId: '6acf740affd5d160536a49c1',             // استبدل بـ Bin ID الخاص بك
            students: JSON.parse(localStorage.getItem('students_data')) || [],
            editingId: null,
            chart: null
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('examDate').valueAsDate = new Date();
            
            // Sync credentials from state to modal inputs
            document.getElementById('modalApiKey').value = state.apiKey;
            document.getElementById('modalBinId').value = state.binId;

            initChart();
            renderData();
            if(state.apiKey && state.binId) {
                loadFromJSONBin();
            }
        });

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function saveModalSettings() {
            state.apiKey = document.getElementById('modalApiKey').value.trim();
            state.binId = document.getElementById('modalBinId').value.trim();
            localStorage.setItem('jsonbin_api_key', state.apiKey);
            localStorage.setItem('jsonbin_bin_key', state.binId);
            toggleModal('configModal');
            loadFromJSONBin();
        }

        function getGradeStatus(pct) {
            if (pct >= 90) return { label: 'Excellent', color: 'bg-emerald-100 text-emerald-700 border-emerald-300' };
            if (pct >= 80) return { label: 'Very Good', color: 'bg-blue-100 text-blue-700 border-blue-300' };
            if (pct >= 65) return { label: 'Good', color: 'bg-indigo-100 text-indigo-700 border-indigo-300' };
            if (pct >= 50) return { label: 'Pass', color: 'bg-amber-100 text-amber-700 border-amber-300' };
            return { label: 'Fail', color: 'bg-rose-100 text-rose-700 border-rose-300' };
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value.trim();
            const unit = document.getElementById('unit').value.trim();
            const lesson = document.getElementById('lesson').value.trim();
            const score = parseFloat(document.getElementById('score').value);
            const maxScore = parseFloat(document.getElementById('maxScore').value);
            const date = document.getElementById('examDate').value;

            const percentage = Math.round((score / maxScore) * 100);

            if (state.editingId) {
                state.students = state.students.map(s => s.id === state.editingId ? 
                    { ...s, name, unit, lesson, score, maxScore, percentage, date } : s);
            } else {
                state.students.push({
                    id: Date.now(),
                    name, unit, lesson, score, maxScore, percentage, date
                });
            }

            saveLocal();
            renderData();
            resetForm();
            syncToJSONBin();
        }

        function editStudent(id) {
            const s = state.students.find(st => st.id === id);
            if (!s) return;
            state.editingId = id;
            document.getElementById('studentId').value = s.id;
            document.getElementById('studentName').value = s.name;
            document.getElementById('unit').value = s.unit;
            document.getElementById('lesson').value = s.lesson;
            document.getElementById('score').value = s.score;
            document.getElementById('maxScore').value = s.maxScore;
            document.getElementById('examDate').value = s.date;
            
            document.getElementById('formTitle').innerText = 'Edit Student Grade';
            document.getElementById('submitBtn').innerText = 'Update Record';
        }

        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this entry?')) {
                state.students = state.students.filter(st => st.id !== id);
                saveLocal();
                renderData();
                syncToJSONBin();
            }
        }

        function resetForm() {
            state.editingId = null;
            document.getElementById('gradeForm').reset();
            document.getElementById('examDate').valueAsDate = new Date();
            document.getElementById('formTitle').innerText = 'Add Student Grade';
            document.getElementById('submitBtn').innerText = 'Save Record';
        }

        function saveLocal() {
            localStorage.setItem('students_data', JSON.stringify(state.students));
        }

        function renderData() {
            const tbody = document.getElementById('studentTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = state.students.filter(s => s.name.toLowerCase().includes(search));
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400">No student records found.</td></tr>`;
            } else {
                filtered.forEach(s => {
                    const status = getGradeStatus(s.percentage);
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-3 font-semibold text-slate-800">${s.name}</td>
                            <td class="p-3">${s.unit}</td>
                            <td class="p-3">${s.lesson}</td>
                            <td class="p-3 font-medium">${s.score} / ${s.maxScore}</td>
                            <td class="p-3 font-bold">${s.percentage}%</td>
                            <td class="p-3">
                                <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${status.color}">
                                    ${status.label}
                                </span>
                            </td>
                            <td class="p-3 text-slate-500 text-xs">${s.date}</td>
                            <td class="p-3 no-print text-center space-x-1">
                                <button onclick="editStudent(${s.id})" class="text-indigo-600 hover:text-indigo-800 px-2 py-1"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deleteStudent(${s.id})" class="text-rose-600 hover:text-rose-800 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }

            updateStats();
            updateChart();
        }

        function updateStats() {
            const total = state.students.length;
            document.getElementById('statTotal').innerText = total;

            if (total === 0) {
                document.getElementById('statAvg').innerText = '0%';
                document.getElementById('statHigh').innerText = '0%';
                document.getElementById('statPass').innerText = '0%';
                return;
            }

            const avg = Math.round(state.students.reduce((acc, curr) => acc + curr.percentage, 0) / total);
            const high = Math.max(...state.students.map(s => s.percentage));
            const passed = state.students.filter(s => s.percentage >= 50).length;
            const passRate = Math.round((passed / total) * 100);

            document.getElementById('statAvg').innerText = avg + '%';
            document.getElementById('statHigh').innerText = high + '%';
            document.getElementById('statPass').innerText = passRate + '%';
        }

        function initChart() {
            const ctx = document.getElementById('gradeChart').getContext('2d');
            state.chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Excellent', 'Very Good', 'Good', 'Pass', 'Fail'],
                    datasets: [{
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: ['#10b981', '#3b82f6', '#6366f1', '#f59e0b', '#f43f5e']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        function updateChart() {
            if (!state.chart) return;
            const counts = { 'Excellent': 0, 'Very Good': 0, 'Good': 0, 'Pass': 0, 'Fail': 0 };
            state.students.forEach(s => {
                const status = getGradeStatus(s.percentage).label;
                counts[status]++;
            });
            state.chart.data.datasets[0].data = Object.values(counts);
            state.chart.update();
        }

        // ================= JSONBin API Services =================

        async function loadFromJSONBin() {
            if (!state.apiKey || !state.binId) return;
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${state.binId}/latest`, {
                    headers: { 'X-Master-Key': state.apiKey }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data.record)) {
                        state.students = data.record;
                        saveLocal();
                        renderData();
                    }
                }
            } catch (err) {
                console.error('Error loading JSONBin:', err);
            }
        }

        async function syncToJSONBin() {
            if (!state.apiKey || !state.binId) {
                alert('Please enter your JSONBin credentials first!');
                toggleModal('configModal');
                return;
            }
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${state.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': state.apiKey
                    },
                    body: JSON.stringify(state.students)
                });
                if (res.ok) {
                    alert('Successfully synced with JSONBin!');
                } else {
                    alert('Failed to sync. Check API Key / Bin ID.');
                }
            } catch (err) {
                alert('Connection error with JSONBin.');
            }
        }
    </script>
</body>
</html>
